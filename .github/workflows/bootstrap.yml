name: Restore GreenBuilt source

on:
  workflow_dispatch:
  push:
    paths:
      - greenbuilt-site.tar.gz

jobs:
  restore-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source bundle
        run: |
          tar -xzf greenbuilt-site.tar.gz
          rm -f greenbuilt-site.tar.gz
          rm -f .github/workflows/bootstrap.yml

      - name: Commit extracted source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: restore unified GreenBuilt source tree"
          git push
